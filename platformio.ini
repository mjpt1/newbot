; Waveshare ESP32-S3-LCD-1.28 (ESP32-S3R2, 16MB flash, 2MB PSRAM, GC9A01 240x240 round)
[env:esp32s3-lcd128]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_unflags = -Os -std=gnu++11
build_flags =
  -O2
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
monitor_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@1.1.16

; ---- Test design B: single 3D eyeball (tests/eye3d). Robot code above stays untouched.
; Upload:  pio run -e eye3d -t upload      Back to robot:  pio run -e esp32s3-lcd128 -t upload
[env:eye3d]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_src_filter = -<*> +<../tests/eye3d/>
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=11
  -DTFT_SCLK=10
  -DTFT_CS=9
  -DTFT_DC=8
  -DTFT_RST=12
  -DTFT_BL=40
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=80000000
  -DLOAD_GLCD=1
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43

; ---- Test design C: cartoon Starboy eye (tests/eyecartoon). Upload: pio run -e eyecartoon -t upload
[env:eyecartoon]
extends = env:eye3d
build_src_filter = -<*> +<../tests/eyecartoon/>

; ---- Test design D: spring cartoon eye, Adafruit lib (tests/eyespring). Upload: pio run -e eyespring -t upload
[env:eyespring]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_src_filter = -<*> +<../tests/eyespring/>
build_flags = -O2 -DBOARD_HAS_PSRAM
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit GC9A01A
